name: Restore phase2 test file

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore phase2 tests from known-good commit
        run: |
          git checkout 97dfba1e45538d41fe0dac2586cc000a07b5dc4f -- tests/test_phase2_automation.py
          if git diff --quiet -- tests/test_phase2_automation.py; then
            echo "Phase2 test file is already restored."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_phase2_automation.py
          git commit -m "fix(tests): restore phase2 automation suite"
          git push origin HEAD:main
