name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          ADMIN_PASSWORD: "Admin@2026!"
        run: |
          pytest -v --tb=short

      - name: Compile check (catch syntax errors early)
        run: |
          python -m py_compile app/__init__.py app/models/*.py app/routes/*.py config.py run.py
