{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="col-md-5">
        <div class="card-modern shadow p-4" style="border-top: 4px solid #dc2626; animation: fadeInUp 0.5s var(--ease);">
            <div class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle"
                 style="width: 56px; height: 56px; background: #fef2f2;">
                <i class="bi bi-shield-exclamation fs-4 text-danger"></i>
            </div>
            <h4 class="fw-bold mb-1 text-center">חובה להחליף סיסמה</h4>
            <p class="text-muted small mb-4 text-center">מטעמי אבטחה, עליך לבחור סיסמה חדשה לפני שתוכל להמשיך להשתמש במערכת.</p>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="input-group mb-1">
                    <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control" required autofocus minlength="8">
                </div>
                <div class="form-text text-muted small mb-3">לפחות 8 תווים, כולל אות וספרה</div>
                <button type="submit" class="btn btn-primary fw-semibold w-100"><i class="bi bi-check2"></i> שמור סיסמה חדשה</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
