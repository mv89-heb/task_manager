{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card-modern shadow p-4" style="border-top: 4px solid var(--brand-blue); animation: fadeInUp 0.4s var(--ease);">

            <div class="text-center mb-4">
                <div class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle"
                     style="width: 56px; height: 56px; background: var(--brand-blue-light);">
                    <i class="bi bi-megaphone fs-4" style="color: var(--brand-blue);"></i>
                </div>
                <h4 class="fw-bold mb-1">דיווח על תקלה</h4>
                <p class="text-muted small m-0">אין צורך בהתחברות - רק מלא/י את הפרטים והצוות הרלוונטי יקבל התראה מיידית</p>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- honeypot אנטי-ספאם - שדה מוסתר, בני אדם לא רואים ולא ממלאים אותו -->
                <div style="position: absolute; left: -9999px;" aria-hidden="true">
                    <input type="text" name="website" tabindex="-1" autocomplete="off">
                </div>

                <div class="mb-3">
                    <label class="form-label small text-muted">מה התקלה? <span class="text-danger">*</span></label>
                    <input type="text" name="title" class="form-control form-control-lg" placeholder="לדוגמה: מעלית תקועה בקומה 2" required maxlength="100">
                </div>

                <div class="mb-3">
                    <label class="form-label small text-muted">פרטים נוספים (אופציונלי)</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="תיאור, מיקום מדויק, מתי זה קרה..."></textarea>
                </div>

                {% if departments %}
                <div class="mb-3">
                    <label class="form-label small text-muted">לאיזו מחלקה זה שייך? (אם ידוע)</label>
                    <select name="department_id" class="form-select">
                        <option value="">לא בטוח / לא רלוונטי</option>
                        {% for d in departments %}
                            <option value="{{ d.id }}">{{ d.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% endif %}

                <hr class="my-4">
                <p class="small text-muted mb-3"><i class="bi bi-info-circle"></i> הפרטים הבאים אופציונליים, אך יעזרו לצוות לחזור אליך אם צריך</p>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small text-muted">השם שלך</label>
                        <input type="text" name="reporter_name" class="form-control" placeholder="לא חובה">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small text-muted">טלפון לחזרה</label>
                        <input type="tel" name="reporter_phone" class="form-control" placeholder="לא חובה">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-semibold">
                    <i class="bi bi-send-fill"></i> שלח דיווח
                </button>
            </form>

        </div>
    </div>
</div>

{% endblock %}
